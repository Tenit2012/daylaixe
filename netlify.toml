# Cau hinh Netlify cho website Thay day lai xe (Next.js 15 App Router).
#
# - Next.js Runtime duoc cai tu dong qua plugin ben duoi (Netlify tu cai,
#   KHONG can them vao package.json nen khong dung lockfile).
# - Migration Prisma chay TRUOC khi build de schema Neon luon dong bo.
#   `prisma migrate deploy` chi ap dung migration con thieu (idempotent),
#   an toan khi chay lai moi lan deploy.
# - Bien moi truong (DATABASE_URL, AUTH_SECRET, ADMIN_*, NEXT_PUBLIC_*) khai
#   bao trong Netlify UI (Site settings > Environment variables), KHONG commit.

[build]
  command = "npm run db:migrate:deploy && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"
  NEXT_TELEMETRY_DISABLED = "1"
  # Bo qua kiem tra checksum engine khi mang han che (khong bat buoc tren Netlify).
  PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
