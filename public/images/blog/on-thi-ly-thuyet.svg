    <circle cx="176" cy="258" r="74" fill="#EA760E"/>
    <text x="176" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF">600</text>
    <rect x="86" y="358" width="180" height="12" rx="6" fill="#3C6CB2"/>
  </g>

  <!-- Phieu trac nghiem -->
