  <rect x="680" y="192" width="340" height="16" rx="8" fill="#182F58"/>
  <rect x="680" y="220" width="250" height="12" rx="6" fill="#C6D0DE"/>

  <circle cx="708" cy="290" r="20" fill="#FFFFFF" stroke="#C6D0DE" stroke-width="5"/>
  <rect x="744" y="280" width="240" height="20" rx="10" fill="#EDF2F8"/>

  <circle cx="708" cy="354" r="20" fill="#FFFFFF" stroke="#C6D0DE" stroke-width="5"/>
  <rect x="744" y="344" width="196" height="20" rx="10" fill="#EDF2F8"/>

  <circle cx="708" cy="418" r="20" fill="#169855"/>
  <path d="M698 418 L706 426 L720 410" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="744" y="408" width="262" height="20" rx="10" fill="#DEF0E5"/>

  <circle cx="708" cy="482" r="20" fill="#FFFFFF" stroke="#C6D0DE" stroke-width="5"/>
  <rect x="744" y="472" width="176" height="20" rx="10" fill="#EDF2F8"/>
