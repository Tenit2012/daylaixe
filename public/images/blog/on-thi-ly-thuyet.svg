<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Cuốn sách bộ 600 câu hỏi lý thuyết đặt cạnh phiếu trắc nghiệm bốn phương án, phương án đúng được tích xanh">
