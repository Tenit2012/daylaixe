  <rect width="1200" height="630" fill="#F7F9FC"/>

  <!-- Cuon sach bo cau hoi -->
  <g transform="translate(130 110) rotate(-8)">
    <rect x="0" y="0" width="340" height="420" rx="20" fill="#182F58"/>
