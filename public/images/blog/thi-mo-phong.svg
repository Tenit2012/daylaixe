<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Màn hình máy tính chiếu tình huống giao thông có biển cảnh báo và thanh điểm năm nấc, bên phải là phím bấm cam để chấm điểm">
