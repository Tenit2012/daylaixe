  <rect x="362" y="164" width="9" height="30" rx="4" fill="#FFFFFF"/>
  <circle cx="366.5" cy="204" r="5.5" fill="#FFFFFF"/>

  <!-- Thanh diem 5 nac -->
  <rect x="660" y="140" width="52" height="18" rx="9" fill="#169855"/>
  <rect x="720" y="140" width="52" height="18" rx="9" fill="#169855"/>
  <rect x="780" y="140" width="52" height="18" rx="9" fill="#EA760E"/>
  <rect x="840" y="140" width="52" height="18" rx="9" fill="#EA760E"/>
  <rect x="900" y="140" width="52" height="18" rx="9" fill="#D93A2B"/>

  <!-- Chan de -->
  <rect x="560" y="520" width="80" height="54" fill="#112242"/>
  <rect x="470" y="574" width="260" height="22" rx="11" fill="#112242"/>

  <!-- Phim bam cham diem -->
