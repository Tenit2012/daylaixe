  <rect width="1200" height="630" fill="#182F58"/>

  <!-- Man hinh -->
  <rect x="200" y="90" width="800" height="430" rx="22" fill="#112242"/>
  <rect x="228" y="118" width="744" height="374" rx="12" fill="#F7F9FC"/>
  <rect x="228" y="118" width="744" height="150" fill="#DEE9F7"/>

  <!-- Canh trong man hinh -->
  <path d="M300 492 L520 268 L700 268 L920 492 Z" fill="#223A5E"/>
  <path d="M602 300 L618 300 L622 340 L598 340 Z" fill="#F7F9FC"/>
  <path d="M596 380 L624 380 L630 440 L590 440 Z" fill="#F7F9FC"/>
  <rect x="512" y="352" width="132" height="76" rx="16" fill="#3C6CB2"/>
  <rect x="540" y="366" width="76" height="30" rx="8" fill="#182F58"/>
  <circle cx="784" cy="368" r="20" fill="#EA760E"/>
  <path d="M766 396 C 766 434 802 434 802 396 Z" fill="#EA760E"/>
  <rect x="776" y="428" width="16" height="46" rx="8" fill="#EA760E"/>

