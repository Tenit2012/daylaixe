    <circle cx="118" cy="-214" r="20" fill="#182F58"/>
    <circle cx="140" cy="-217" r="16" fill="none" stroke="#EA760E" stroke-width="8"/>
    <rect x="152" y="-224" width="44" height="14" rx="7" fill="#EA760E"/>
    <rect x="168" y="-210" width="8" height="12" fill="#EA760E"/>
    <rect x="184" y="-210" width="8" height="12" fill="#EA760E"/>
    <path d="M150 -318 L176 -314 L176 -344 Z" fill="#FFFFFF"/>
    <rect x="110" y="-424" width="140" height="110" rx="28" fill="#FFFFFF" stroke="#DEE9F7" stroke-width="4"/>
