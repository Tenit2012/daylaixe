<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Người cầm chìa khóa đứng ngần ngại bên cạnh chiếc xe đang đỗ, phía trên đầu là bong bóng thoại có dấu hỏi">
  <title>Có bằng nhưng còn ngần ngại cầm lái</title>
  <rect width="1200" height="630" fill="#F7F9FC"/>
  <rect y="520" width="1200" height="110" fill="#E7EDF5"/>
  <path d="M0 520 H1200" stroke="#C6D0DE" stroke-width="6"/>

  <!-- Xe dang do -->
  <g transform="translate(830 470)">
    <rect x="-210" y="-58" width="420" height="64" rx="18" fill="#3C6CB2"/>
    <path d="M-128 -58 L-96 -122 L76 -122 L128 -58 Z" fill="#3C6CB2"/>
