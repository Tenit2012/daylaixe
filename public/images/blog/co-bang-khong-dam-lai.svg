    <path d="M6 -112 L68 -112 L112 -66 L6 -66 Z" fill="#DEE9F7"/>
    <path d="M-8 -66 L-8 0" stroke="#2C568F" stroke-width="4"/>
    <rect x="-214" y="-40" width="20" height="16" rx="6" fill="#F7F9FC"/>
    <rect x="196" y="-40" width="18" height="16" rx="6" fill="#D93A2B"/>
    <circle cx="-124" cy="6" r="44" fill="#112242"/>
    <circle cx="-124" cy="6" r="19" fill="#C6D0DE"/>
    <circle cx="124" cy="6" r="44" fill="#112242"/>
    <circle cx="124" cy="6" r="19" fill="#C6D0DE"/>
  </g>

  <!-- Khoang cach ngan ngai -->
  <path d="M430 500 H600" stroke="#C6D0DE" stroke-width="5" stroke-dasharray="18 16" stroke-linecap="round"/>

  <!-- Nguoi cam chia khoa -->
  <g transform="translate(300 470)">
    <circle cx="0" cy="-232" r="44" fill="#182F58"/>
    <rect x="-52" y="-190" width="104" height="132" rx="34" fill="#182F58"/>
    <rect x="-42" y="-64" width="34" height="66" rx="14" fill="#112242"/>
    <rect x="8" y="-64" width="34" height="66" rx="14" fill="#112242"/>
