<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Vô lăng nhìn chính diện với hai bàn tay đặt đúng vị trí chín giờ và ba giờ, phía trên là mũi tên chỉ hướng đánh lái">
  <title>Hai tay đặt đúng vị trí trên vô lăng</title>
  <rect width="1200" height="630" fill="#182F58"/>

  <g transform="translate(600 330)">
    <!-- Mui ten huong danh lai -->
    <path d="M-170 -170 A 240 240 0 0 1 170 -170" fill="none" stroke="#169855" stroke-width="10" stroke-dasharray="24 20" stroke-linecap="round"/>
    <path d="M178.5 -161.5 L143.5 -171.7 L168.3 -196.5 Z" fill="#169855"/>

    <!-- Vanh vo lang -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="#F7F9FC" stroke-width="34"/>

    <!-- Nan hoa -->
    <rect x="-190" y="-22" width="130" height="44" rx="22" fill="#F7F9FC"/>
    <rect x="60" y="-22" width="130" height="44" rx="22" fill="#F7F9FC"/>
    <rect x="-24" y="60" width="48" height="130" rx="24" fill="#F7F9FC"/>

    <!-- Bau vo lang -->
    <circle cx="0" cy="0" r="64" fill="#112242"/>
    <circle cx="0" cy="0" r="34" fill="#3C6CB2"/>

    <!-- Tay trai o vi tri 9 gio -->
    <rect x="-252" y="-54" width="74" height="108" rx="30" fill="#EA760E"/>
    <rect x="-186" y="-46" width="54" height="20" rx="10" fill="#F0902F"/>
    <rect x="-186" y="-20" width="54" height="20" rx="10" fill="#F0902F"/>
    <rect x="-186" y="6" width="54" height="20" rx="10" fill="#F0902F"/>
    <rect x="-186" y="32" width="54" height="20" rx="10" fill="#F0902F"/>
    <rect x="-206" y="-74" width="22" height="44" rx="11" fill="#F0902F"/>

    <!-- Tay phai o vi tri 3 gio -->
    <rect x="178" y="-54" width="74" height="108" rx="30" fill="#EA760E"/>
    <rect x="132" y="-46" width="54" height="20" rx="10" fill="#F0902F"/>
    <rect x="132" y="-20" width="54" height="20" rx="10" fill="#F0902F"/>
    <rect x="132" y="6" width="54" height="20" rx="10" fill="#F0902F"/>
    <rect x="132" y="32" width="54" height="20" rx="10" fill="#F0902F"/>
    <rect x="184" y="-74" width="22" height="44" rx="11" fill="#F0902F"/>
  </g>
</svg>
