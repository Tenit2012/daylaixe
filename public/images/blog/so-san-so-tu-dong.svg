<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="So sánh hai bên: bên trái cần số sàn có ký hiệu chữ H và ba bàn đạp, bên phải cần số tự động trong rãnh P R N D và hai bàn đạp">
  <title>So sánh xe số sàn và xe số tự động</title>
  <rect width="600" height="630" fill="#F7F9FC"/>
  <rect x="600" width="600" height="630" fill="#182F58"/>
  <rect x="594" width="12" height="630" fill="#EA760E"/>

  <!-- SO SAN: nam ba bac, ky hieu H tren nam -->
  <circle cx="300" cy="250" r="64" fill="#182F58"/>
  <path d="M276 226 L276 274 M324 226 L324 274 M276 250 L324 250" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <rect x="288" y="306" width="24" height="140" rx="12" fill="#9FB6D4"/>
  <path d="M236 500 L364 500 L338 442 L262 442 Z" fill="#C6D0DE"/>
  <rect x="210" y="500" width="180" height="16" rx="8" fill="#182F58"/>
  <!-- Ba ban dap: con, phanh, ga -->
  <rect x="178" y="546" width="58" height="66" rx="12" fill="#EA760E"/>
  <rect x="268" y="546" width="58" height="66" rx="12" fill="#182F58"/>
  <rect x="358" y="546" width="58" height="66" rx="12" fill="#182F58"/>

  <!-- SO TU DONG: can gat trong ranh P R N D -->
  <rect x="872" y="180" width="64" height="330" rx="32" fill="#112242"/>
  <text x="990" y="222" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="#9FB6D4">P</text>
  <text x="990" y="302" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="#9FB6D4">R</text>
  <text x="990" y="382" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="#9FB6D4">N</text>
  <text x="990" y="462" font-family="system-ui, sans-serif" font-size="52" font-weight="700" fill="#F7F9FC">D</text>
  <rect x="892" y="410" width="24" height="60" rx="12" fill="#C6D0DE"/>
  <circle cx="904" cy="462" r="52" fill="#F7F9FC"/>
  <!-- Hai ban dap: phanh, ga -->
  <rect x="826" y="546" width="58" height="66" rx="12" fill="#F7F9FC"/>
  <rect x="924" y="546" width="58" height="66" rx="12" fill="#9FB6D4"/>
</svg>
