<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Sơ đồ sa hình nhìn từ trên cao với đường chạy khép kín, ba vị trí hay mắc lỗi được khoanh tròn đỏ kèm dấu chấm than">
  <title>Những điểm hay mắc lỗi trên sa hình</title>
  <rect width="1200" height="630" fill="#F7F9FC"/>

  <!-- Duong chay sa hinh -->
  <rect x="140" y="110" width="920" height="410" rx="90" fill="none" stroke="#182F58" stroke-width="54"/>
  <rect x="140" y="110" width="920" height="410" rx="90" fill="none" stroke="#F7F9FC" stroke-width="4" stroke-dasharray="26 22" opacity="0.75"/>

  <!-- Coc tieu doc duong -->
  <g fill="#EA760E">
    <circle cx="140" cy="240" r="9"/>
    <circle cx="140" cy="390" r="9"/>
    <circle cx="380" cy="110" r="9"/>
    <circle cx="820" cy="110" r="9"/>
    <circle cx="1060" cy="240" r="9"/>
    <circle cx="1060" cy="390" r="9"/>
    <circle cx="380" cy="520" r="9"/>
    <circle cx="820" cy="520" r="9"/>
  </g>

  <!-- Chuong ghep xe re vao tu duong chay -->
  <path d="M470 470 L470 300 L730 300 L730 470" fill="none" stroke="#EA760E" stroke-width="7" stroke-dasharray="26 20" stroke-linecap="round"/>
  <circle cx="470" cy="470" r="9" fill="#EA760E"/>
  <circle cx="730" cy="470" r="9" fill="#EA760E"/>
  <path d="M600 470 L600 486" stroke="#C6D0DE" stroke-width="6" stroke-dasharray="10 10" stroke-linecap="round"/>

  <!-- Xe dang chay tren sa hinh -->
  <rect x="530" y="497" width="150" height="46" rx="16" fill="#F7F9FC"/>
  <rect x="566" y="506" width="66" height="28" rx="9" fill="#3C6CB2"/>
  <rect x="539" y="510" width="22" height="20" rx="7" fill="#9FB6D4"/>

  <!-- Ba diem hay mac loi -->
  <circle cx="200" cy="180" r="62" fill="none" stroke="#D93A2B" stroke-width="8"/>
  <circle cx="244" cy="136" r="22" fill="#D93A2B"/>
  <rect x="240.5" y="124" width="7" height="16" rx="3" fill="#FFFFFF"/>
  <circle cx="244" cy="147" r="4" fill="#FFFFFF"/>

  <circle cx="600" cy="110" r="58" fill="none" stroke="#D93A2B" stroke-width="8"/>
  <circle cx="641" cy="70" r="22" fill="#D93A2B"/>
  <rect x="637.5" y="58" width="7" height="16" rx="3" fill="#FFFFFF"/>
  <circle cx="641" cy="81" r="4" fill="#FFFFFF"/>

  <circle cx="1000" cy="450" r="62" fill="none" stroke="#D93A2B" stroke-width="8"/>
  <circle cx="1044" cy="406" r="22" fill="#D93A2B"/>
  <rect x="1040.5" y="394" width="7" height="16" rx="3" fill="#FFFFFF"/>
  <circle cx="1044" cy="417" r="4" fill="#FFFFFF"/>
</svg>
