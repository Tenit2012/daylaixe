<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Xe tập lái nhìn chính diện, gắn biển TẬP LÁI màu xanh trên nóc, hai bên là các cọc tiêu hình chóp màu cam trong sân tập">
  <title>Xe tập lái gắn biển TẬP LÁI trong sân tập</title>
  <rect width="1200" height="630" fill="#F7F9FC"/>
  <rect y="500" width="1200" height="130" fill="#E7EDF5"/>
  <path d="M0 500 H1200" stroke="#C6D0DE" stroke-width="6"/>

  <g transform="translate(600 404)">
    <!-- Bien TAP LAI tren noc -->
    <rect x="-120" y="-236" width="240" height="64" rx="10" fill="#3C6CB2"/>
    <text x="0" y="-192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">TẬP LÁI</text>
    <rect x="-70" y="-176" width="12" height="26" fill="#112242"/>
    <rect x="58" y="-176" width="12" height="26" fill="#112242"/>

    <!-- Than xe nhin chinh dien -->
    <path d="M-190 -70 L-160 -152 L160 -152 L190 -70 Z" fill="#182F58"/>
    <path d="M-168 -80 L-144 -140 L144 -140 L168 -80 Z" fill="#DEE9F7"/>
    <path d="M-100 -84 L-40 -128" stroke="#9FB6D4" stroke-width="5" stroke-linecap="round"/>
    <path d="M20 -84 L80 -128" stroke="#9FB6D4" stroke-width="5" stroke-linecap="round"/>
    <rect x="-230" y="-70" width="460" height="140" rx="28" fill="#182F58"/>
    <rect x="-224" y="-118" width="44" height="24" rx="10" fill="#112242"/>
    <rect x="180" y="-118" width="44" height="24" rx="10" fill="#112242"/>
    <rect x="-206" y="-34" width="96" height="38" rx="14" fill="#F7F9FC"/>
    <rect x="110" y="-34" width="96" height="38" rx="14" fill="#F7F9FC"/>
    <rect x="-70" y="-30" width="140" height="30" rx="10" fill="#112242"/>
    <rect x="-230" y="22" width="460" height="48" rx="18" fill="#112242"/>
    <rect x="-64" y="30" width="128" height="32" rx="6" fill="#F7F9FC"/>
    <rect x="-206" y="64" width="76" height="32" rx="12" fill="#0C1830"/>
    <rect x="130" y="64" width="76" height="32" rx="12" fill="#0C1830"/>
  </g>

  <!-- Coc tieu -->
  <g>
    <path d="M174 540 L226 540 L209 476 L191 476 Z" fill="#EA760E"/>
    <rect x="166" y="532" width="68" height="14" rx="6" fill="#112242"/>
    <rect x="181" y="506" width="38" height="12" fill="#F7F9FC"/>
  </g>
  <g>
    <path d="M274 570 L326 570 L309 506 L291 506 Z" fill="#EA760E"/>
    <rect x="266" y="562" width="68" height="14" rx="6" fill="#112242"/>
    <rect x="281" y="536" width="38" height="12" fill="#F7F9FC"/>
  </g>
  <g>
    <path d="M984 556 L1036 556 L1019 492 L1001 492 Z" fill="#EA760E"/>
    <rect x="976" y="548" width="68" height="14" rx="6" fill="#112242"/>
    <rect x="991" y="522" width="38" height="12" fill="#F7F9FC"/>
  </g>
</svg>
