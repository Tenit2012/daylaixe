<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Sơ đồ minh họa bài ghép xe dọc">
  <title>Sơ đồ minh họa bài ghép xe dọc: vị trí chuẩn bị, đường lùi và vị trí hoàn tất</title>
  <!--
    So do nguyen ly (khong phai kich thuoc chuan). Ve tu noi dung bai viet
    "Bai ghep xe doc va ngang", khong sao chep giao dien cua bat ky ung dung
    hay san pham nao khac.
  -->
  <defs>
    <marker id="arrowOrangeDoc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#EA760E"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="#FFFFFF"/>
  <rect x="40" y="30" width="720" height="460" rx="12" fill="#DEE9F7"/>

  <line x1="80" y1="100" x2="700" y2="100" stroke="#C6D0DE" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <text x="410" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#3C6CB2">Làn đường trước khi vào bài</text>

  <rect x="560" y="140" width="160" height="300" rx="8" fill="#FFFFFF" fill-opacity="0.7" stroke="#182F58" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="640" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#182F58">CHUỒNG</text>

  <rect x="365" y="164" width="110" height="52" rx="10" fill="none" stroke="#182F58" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="365" cy="190" r="16" fill="#EA760E"/>
  <text x="365" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
  <text x="420" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#182F58">Vị trí chuẩn bị</text>

  <path d="M 420 216 C 460 280 540 300 610 288" fill="none" stroke="#EA760E" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#arrowOrangeDoc)"/>
  <text x="470" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-style="italic" fill="#3C6CB2">lùi xe, đánh hết lái</text>
  <circle cx="520" cy="292" r="16" fill="#EA760E"/>
  <text x="520" y="298" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
  <text x="520" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#182F58">Điểm đánh lái</text>

  <g>
    <rect x="614" y="235" width="52" height="110" rx="10" fill="#182F58"/>
    <rect x="624" y="245" width="32" height="22" rx="4" fill="#DEE9F7"/>
    <rect x="608" y="255" width="6" height="18" rx="2" fill="#112242"/>
    <rect x="662" y="255" width="6" height="18" rx="2" fill="#112242"/>
    <rect x="608" y="320" width="6" height="18" rx="2" fill="#112242"/>
    <rect x="662" y="320" width="6" height="18" rx="2" fill="#112242"/>
  </g>
  <circle cx="640" cy="213" r="16" fill="#EA760E"/>
  <text x="640" y="219" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
  <text x="640" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#182F58">Vị trí hoàn tất</text>
</svg>
