<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Sơ đồ minh họa bài ghép xe ngang">
  <title>Sơ đồ minh họa bài ghép xe ngang: vị trí chuẩn bị, đường lùi và vị trí hoàn tất</title>
  <!--
    So do nguyen ly (khong phai kich thuoc chuan). Ve tu noi dung bai viet
    "Bai ghep xe doc va ngang", khong sao chep giao dien cua bat ky ung dung
    hay san pham nao khac.
  -->
  <defs>
    <marker id="arrowOrangeNgang" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#EA760E"/>
    </marker>
  </defs>

  <rect width="800" height="480" fill="#FFFFFF"/>
  <rect x="40" y="30" width="720" height="420" rx="12" fill="#DEE9F7"/>

  <line x1="80" y1="110" x2="700" y2="110" stroke="#C6D0DE" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <text x="410" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#3C6CB2">Làn đường trước khi vào bài</text>

  <rect x="580" y="140" width="110" height="52" rx="10" fill="none" stroke="#182F58" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="690" cy="166" r="16" fill="#EA760E"/>
  <text x="690" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
  <text x="635" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#182F58">Vị trí chuẩn bị</text>

  <path d="M 635 192 C 560 225 470 245 400 285" fill="none" stroke="#EA760E" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#arrowOrangeNgang)"/>

  <circle cx="480" cy="240" r="16" fill="#EA760E"/>
  <text x="480" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
  <text x="455" y="214" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#182F58">Điểm đánh lái</text>

  <rect x="310" y="280" width="220" height="90" rx="8" fill="#FFFFFF" fill-opacity="0.7" stroke="#182F58" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="420" y="435" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#182F58">CHUỒNG</text>

  <g>
    <rect x="365" y="299" width="110" height="52" rx="10" fill="#182F58"/>
    <rect x="438" y="309" width="30" height="32" rx="4" fill="#DEE9F7"/>
    <rect x="383" y="293" width="18" height="6" rx="2" fill="#112242"/>
    <rect x="437" y="293" width="18" height="6" rx="2" fill="#112242"/>
    <rect x="383" y="351" width="18" height="6" rx="2" fill="#112242"/>
    <rect x="437" y="351" width="18" height="6" rx="2" fill="#112242"/>
  </g>
  <circle cx="420" cy="260" r="16" fill="#EA760E"/>
  <text x="420" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
  <text x="545" y="330" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#182F58">Vị trí hoàn tất</text>

  <rect x="60" y="372" width="680" height="10" rx="3" fill="#3C6CB2"/>
  <text x="400" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#3C6CB2">Mép vỉa hè</text>
</svg>
