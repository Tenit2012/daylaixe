<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Vị trí đặt video cảm nhận học viên">
  <title>Vị trí đặt video cảm nhận học viên</title>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEE9F7"/>
      <stop offset="100%" stop-color="#F7F9FC"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182F58"/>
      <stop offset="100%" stop-color="#112242"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#navyGrad)"/>
  <circle cx="400" cy="200" r="60" fill="#FFFFFF" opacity="0.9"/>
  <path d="M 383 170 L 432 200 L 383 230 Z" fill="#182F58"/>
  <text x="400" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#DEE9F7">Video cảm nhận sẽ được đăng sau</text>
  <text x="400" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#3C6CB2">khi học viên đồng ý chia sẻ</text>
</svg>
