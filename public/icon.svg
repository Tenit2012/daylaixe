<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Thầy Tùng Dạy Lái Xe</title>
  <desc id="desc">Biểu tượng vô lăng, mũ tốt nghiệp và con đường.</desc>

  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity=".12"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Graduation cap -->
  <path d="M132 144 256 88l124 56-124 58z" fill="url(#green)"/>
  <path d="M166 160v52c31 30 149 30 180 0v-52l-90 42z" fill="#0F766E"/>
  <path d="M380 145v58" fill="none" stroke="#F59E0B" stroke-width="10" stroke-linecap="round"/>
  <rect x="369" y="196" width="22" height="38" rx="8" fill="#F59E0B"/>

  <!-- Mint accent -->
  <path d="M129 202c-43 49-57 118-30 178 11 25 28 47 50 65l39-26c-45-34-62-94-42-147 9-24 24-44 43-60z"
        fill="url(#mint)" opacity=".85"/>

  <!-- Steering wheel -->
  <circle cx="256" cy="294" r="118" fill="none" stroke="url(#green)" stroke-width="38"/>
  <circle cx="256" cy="294" r="42" fill="url(#green)"/>
  <path d="M219 276 171 245M293 276l48-31M232 326l-31 51M280 326l31 51"
        fill="none" stroke="#065F46" stroke-width="27" stroke-linecap="round"/>
  <text x="256" y="313" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="58" font-weight="700" fill="#FFFFFF">T</text>

  <!-- Road -->
  <path d="M92 449c77-70 143-86 216-68 55 14 83 2 122-36"
        fill="none" stroke="url(#green)" stroke-width="60" stroke-linecap="round"/>
  <path d="M110 447c69-56 126-68 191-52 56 14 94 2 129-31"
        fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="34 27"/>
</svg>
